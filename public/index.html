<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Pea Server — Креатив-сервер</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; text-align: center; margin-top: 60px; background: #0f1115; color: #f1f1f1; }
        .card { max-width: 480px; margin: 0 auto; padding: 32px; background: #181b20; border: 1px solid #2a2f3a; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #ffffff; }
        p { color: #a0a8b8; font-size: 15px; line-height: 1.5; }
        button { padding: 12px 26px; font-size: 16px; cursor: pointer; background: #2ea043; color: white; border: none; border-radius: 6px; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #3fb950; }
        button:disabled { background: #3b4048; color: #8b949e; cursor: not-allowed; }
        #result { margin-top: 24px; font-size: 15px; line-height: 1.7; text-align: left; }
        .result-box { background: #121418; padding: 14px; border-radius: 8px; border: 1px solid #2a2f3a; margin-top: 12px; }
        code { background: #252a33; padding: 3px 6px; border-radius: 4px; font-size: 14px; color: #58a6ff; user-select: all; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Креатив-сервер</h2>
        <p>Порт за замовчуванням: <strong>27015</strong>. Скопіюйте IP та вставте в гру для підключення.</p>
        <button id="createBtn">Запустити сервер</button>
        <div id="result"></div>
    </div>

    <script>
        const btn = document.getElementById('createBtn');
        const resultDiv = document.getElementById('result');

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            resultDiv.innerHTML = "Запуск креатив-сервера...";

            try {
                const response = await fetch('/api/create-server', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ max_players: 16, game_type: 'creative' })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || ('Помилка сервера: ' + response.status));
                }

                resultDiv.innerHTML = `
                    <div class="result-box">
                        <p style="color: #3fb950; font-weight: bold; margin: 0 0 8px 0;">Сервер активний!</p>
                        <div style="margin-bottom: 6px;"><strong>ID:</strong> ${data.id}</div>
                        <div style="margin-bottom: 6px;"><strong>Домен:</strong> <code>${data.host}</code></div>
                        <div style="margin-bottom: 6px;"><strong>IP-адреса:</strong> <code style="color: #3fb950; font-weight: bold;">${data.ip}</code></div>
                        <div style="color: #8b949e; font-size: 13px; margin-top: 8px;">Автозакриття без гравців через: ${data.expires_in}</div>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: #f85149; text-align: center;">${error.message}</p>`;
                console.error(error);
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
